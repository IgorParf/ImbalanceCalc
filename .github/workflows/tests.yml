name: Тести

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Консоль runner-а працює в cp1252 — без цього будь-який print з
# кирилицею падає з UnicodeEncodeError.
env:
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    # Windows: код читає системну теку «Завантаження» через SHGetKnownFolderPath
    # і формує PDF зі шрифтом matplotlib — це має перевірятися на цільовій ОС.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,desktop,docs]"

      - name: Перевірка стилю
        run: ruff check .

      - name: Тести
        run: pytest -q

      - name: Самоперевірка запускача
        run: python desktop/main.py --selfcheck
