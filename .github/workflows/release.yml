name: Випуск

# Збірка інсталятора та створення випуску за тегом:
#     git tag v0.1.2 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Консоль runner-а працює в cp1252 — без цього будь-який print з
# кирилицею падає з UnicodeEncodeError.
env:
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build,docs]"

      - name: Тести
        run: pytest -q

      - name: Інструкція користувача
        run: python scripts/make_user_guide.py

      # build.ps1 очікує venv у корені проєкту; у CI використовуємо
      # інтерпретатор runner-а напряму.
      - name: Іконка та ресурс версії
        run: |
          python scripts/make_icon.py
          python scripts/make_version_info.py

      # Захисник Windows сканує кожну з сотень щойно записаних DLL при першому
      # запуску зібраного застосунку, через що самоперевірка тягнеться хвилинами.
      - name: Виняток антивірусу для теки збірки
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE "dist")
          Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE "build")

      - name: Збірка застосунку
        run: python -m PyInstaller installer/imbalance_calc.spec --noconfirm --distpath dist --workpath build

      - name: Самоперевірка збірки
        timeout-minutes: 8
        run: |
          # ImbalanceCalc.exe зібрано як віконний (console=False), тому оболонка
          # НЕ чекає на його завершення: виклик через "&" повертає керування
          # одразу, а $LASTEXITCODE стосується попередньої команди — крок міг би
          # «проходити» або падати випадково, не дочекавшись результату.
          $check = Start-Process ".\dist\ImbalanceCalc\ImbalanceCalc.exe" `
            -ArgumentList "--selfcheck" -PassThru
          # Обовʼязково торкнутися .Handle: об'єкт від Start-Process -PassThru
          # інакше не кешує дескриптор процесу, і WaitForExit/ExitCode його
          # не бачать. У pwsh 7 це проявилось так, що перевірка успішно
          # завершувалась за 2 секунди, а очікування падало за таймаутом.
          $null = $check.Handle
          # Очікування з межею: якщо процес справді зависне, крок впаде за дві
          # хвилини зі зрозумілим текстом, а не висітиме до таймауту кроку.
          if (-not $check.WaitForExit(120000)) {
            $check.Kill()
            throw "Самоперевірка не завершилася за 2 хвилини"
          }
          if ($check.ExitCode -ne 0) {
            $log = "$env:LOCALAPPDATA\ImbalanceCalc\logs\desktop.log"
            if (Test-Path $log) { Get-Content $log -Tail 20 }
            throw "Самоперевірка збірки провалена (код $($check.ExitCode))"
          }
          Write-Host "Самоперевірка пройдена."

      # Виконується завжди: якщо самоперевірка зависне і крок обірве таймаут,
      # журнал із позначками етапів — єдине джерело інформації про причину.
      - name: Журнал самоперевірки
        if: always()
        run: |
          $log = "$env:LOCALAPPDATA\ImbalanceCalc\logs\desktop.log"
          if (Test-Path $log) { Get-Content $log } else { "Журнал не створено: $log" }

      - name: Інсталятор
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Inno Setup зазвичай є в образі windows-latest, але склад образу
          # змінюється — ставимо, якщо раптом немає.
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & $iscc "/DAppVersion=$version" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершився з помилкою" }

      - name: Публікація випуску
        uses: softprops/action-gh-release@v2
        with:
          # Не draft: інакше повторний push того самого тега зняв би вже
          # опублікований випуск назад у чернетки.
          draft: false
          files: |
            dist/ImbalanceCalc-*-setup.exe
            docs/user-guide.docx
          body: |
            ## Встановлення

            1. Завантажте `ImbalanceCalc-*-setup.exe` нижче.
            2. Запустіть його. Windows покаже попередження «Система Windows
               захистила ваш комп'ютер» — програма не має платного цифрового
               підпису. Натисніть «Додаткові відомості» → «Виконати в
               будь-якому разі».
            3. Права адміністратора не потрібні: програма встановлюється лише
               для вашого облікового запису.

            Докладна інструкція — у файлі `user-guide.docx` нижче.

            Ваші дані після оновлення зберігаються.
