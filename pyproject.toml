[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imbalance-calc"
version = "0.1.2"
description = "Розрахунок платежу за небаланси електричної енергії з аналізом по добах"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    # width="stretch" замість застарілого use_container_width — з 1.62
    "streamlit>=1.62",
    "altair>=5.3",
    "matplotlib>=3.8",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Запуск у нативному вікні Windows: python desktop/main.py
desktop = [
    "pywebview>=5.0",
]
# Збірка Windows-додатку: installer/build.ps1
build = [
    "pywebview>=5.0",
    "pyinstaller>=6.16",
]
# Генерація інструкції користувача: scripts/make_user_guide.py
docs = [
    "python-docx>=1.1",
]

[project.scripts]
imbalance-calc = "imbalance_calc.cli:main"

[project.gui-scripts]
imbalance-calc-desktop = "desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
